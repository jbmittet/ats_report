[package]
name = "ats-inspector"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "ats-inspector"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
lopdf = "0.32"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.7"
pdfium-render = { version = "0.8", features = ["thread_safe"] }

[build-dependencies]
ureq = "2"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
serde_json = "1"
